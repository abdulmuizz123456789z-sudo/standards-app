<div id="lockScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color, #f4f4f7); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
    <div style="background: var(--card-bg, #ffffff); padding: 24px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; width: 100%; max-width: 320px; border: 1px solid rgba(0,0,0,0.05);">
        <div style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">Himoyalangan Hudud</div>
        <div style="font-size: 13px; color: var(--hint-color, #8e8e93); margin-bottom: 20px;">Parolni kiriting</div>
        
        <input type="password" id="passwordInput" placeholder="Parol..." style="width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.08); background: var(--bg-color, #f4f4f7); color: var(--text-color, #1c1c1e); font-size: 16px; box-sizing: border-box; margin-bottom: 12px; outline: none; text-align: center;">
        
        <button id="checkPassBtn" style="width: 100%; padding: 14px; border-radius: 14px; border: none; background: #e4002b; color: white; font-size: 15px; font-weight: 600; cursor: pointer;">Kirish</button>
        
        <div id="passErrorMsg" style="color: #ff3b30; font-size: 13px; font-weight: 600; margin-top: 12px; height: 18px; opacity: 0; transition: opacity 0.2s;">Noto'g'ri parol!</div>
    </div>
</div>

<script>
    const CORRECT_PASSWORD = "!KFC2026";

    document.getElementById('checkPassBtn').addEventListener('click', validatePassword);
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') validatePassword();
    });

    function validatePassword() {
        const input = document.getElementById('passwordInput').value.trim();
        const errorMsg = document.getElementById('passErrorMsg');
        
        if (input === CORRECT_PASSWORD) {
            const lockScreen = document.getElementById('lockScreen');
            lockScreen.style.opacity = '0';
            setTimeout(() => {
                lockScreen.style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }, 300);
        } else {
            errorMsg.style.opacity = '1';
            document.getElementById('passwordInput').style.borderColor = '#ff3b30';
            setTimeout(() => {
                errorMsg.style.opacity = '0';
            }, 2000);
        }
    }
</script>
